<title>Bridge — 英語独学トレーナー</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#EFF3F5; --card:#FFFFFF; --ink:#18262F; --muted:#5B6B76; --line:#D9E2E8;
  --accent:#0F6FAE; --accent-soft:#E3EFF7; --accent-ink:#FFFFFF;
  --good:#2F8F5B; --good-soft:#E4F2EA; --warn:#C8641E; --warn-soft:#F7EBE0;
  --dot-vocab:#C4504F; --dot-sak:#C97B29; --dot-shadow:#3D7DC8; --dot-listen:#3E8E7E; --dot-speech:#5B8C4A;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0F1519; --card:#18222A; --ink:#E7EDF1; --muted:#93A4AF; --line:#243039;
    --accent:#4FA3DC; --accent-soft:#1A2E3D; --accent-ink:#0F1519;
    --good:#57B583; --good-soft:#16281E; --warn:#DE8A45; --warn-soft:#2E2015;
  }
}
:root[data-theme="light"]{
  --bg:#EFF3F5; --card:#FFFFFF; --ink:#18262F; --muted:#5B6B76; --line:#D9E2E8;
  --accent:#0F6FAE; --accent-soft:#E3EFF7; --accent-ink:#FFFFFF;
  --good:#2F8F5B; --good-soft:#E4F2EA; --warn:#C8641E; --warn-soft:#F7EBE0;
}
:root[data-theme="dark"]{
  --bg:#0F1519; --card:#18222A; --ink:#E7EDF1; --muted:#93A4AF; --line:#243039;
  --accent:#4FA3DC; --accent-soft:#1A2E3D; --accent-ink:#0F1519;
  --good:#57B583; --good-soft:#16281E; --warn:#DE8A45; --warn-soft:#2E2015;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  font-size:16px; line-height:1.6;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
}
button{font-family:inherit;font-size:1rem;cursor:pointer;border:none;border-radius:10px;background:var(--card);color:var(--ink)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.app{
  padding:calc(14px + env(safe-area-inset-top)) 18px 10px;
  display:flex;justify-content:space-between;align-items:baseline;max-width:640px;margin:0 auto;
}
header.app .brand{font-weight:800;font-size:1.15rem;letter-spacing:.02em}
header.app .brand span{color:var(--accent)}
header.app .date{color:var(--muted);font-size:.85rem}
main{max-width:640px;margin:0 auto;padding:0 14px}
section.tab{display:none}
section.tab.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
h2{font-size:1.02rem;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
h2 .eyebrow{font-size:.7rem;letter-spacing:.14em;color:var(--muted);font-weight:600}
.muted{color:var(--muted);font-size:.85rem}
.small{font-size:.85rem}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
/* home */
.streak{display:flex;gap:14px;align-items:center}
.streak .num{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.week{display:flex;gap:8px;margin-top:10px}
.week .d{width:30px;text-align:center;font-size:.7rem;color:var(--muted)}
.week .d .c{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);margin:0 auto 3px;display:flex;align-items:center;justify-content:center;font-size:.75rem}
.week .d .c.core{border-color:var(--good);color:var(--good)}
.week .d .c.full{background:var(--good);border-color:var(--good);color:#fff}
.tasklist{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px}
.task.done{background:var(--good-soft);border-color:transparent}
.task .chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.task.done .chk{background:var(--good);border-color:var(--good)}
.task .info{flex:1;min-width:0}
.task .info .t{font-weight:700}
.task .info .s{font-size:.8rem;color:var(--muted)}
.task .go{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.85rem;padding:8px 12px;border-radius:10px;flex:none}
.timerbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));display:none;justify-content:center;pointer-events:none;z-index:30}
.timerbar.on{display:flex}
.timerbar .inner{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.timerbar .time{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.1rem}
.timerbar button{background:transparent;color:inherit;font-size:.85rem;padding:4px 6px}
/* drill (vocab / sakubun) */
.drillcard{min-height:200px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.drillcard .q{font-size:1.35rem;font-weight:700;text-wrap:balance}
.drillcard .a{font-size:1.25rem;color:var(--accent);font-weight:700;font-family:Georgia,"Times New Roman",serif}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:12px;font-weight:700;border:1px solid var(--line)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.btn.ghost{background:transparent;color:var(--accent);border-color:transparent;font-weight:600}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .2s}
@media (prefers-reduced-motion: reduce){ .progress i{transition:none} }
/* lists */
.rowbtn{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.rowbtn .info{flex:1;min-width:0}
.rowbtn .t{font-weight:700}
.rowbtn .s{font-size:.8rem;color:var(--muted)}
.rowbtn .arr{color:var(--muted)}
/* shadowing detail */
.script{font-family:Georgia,"Times New Roman",serif;font-size:1.06rem;line-height:1.75}
.script .sent{padding:2px 4px;border-radius:6px;cursor:pointer}
.script .sent.playing{background:var(--accent-soft)}
.jp-line{font-family:inherit;font-size:.82rem;color:var(--muted);display:block;margin:0 4px 6px}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.controls label{font-size:.85rem;color:var(--muted)}
input[type=range]{accent-color:var(--accent);width:130px}
select,input[type=text]{font-family:inherit;font-size:.95rem;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.vocabnote{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.vocabnote dt{font-weight:700;font-family:Georgia,serif;display:inline}
.vocabnote dd{display:inline;margin:0 0 0 6px;color:var(--muted);font-size:.88rem}
.vocabnote div{margin-bottom:4px}
/* speech */
.bigtimer{font-size:3.4rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em;margin:6px 0}
.hints{margin:8px 0 4px;padding-left:1.2em}
.hints li{margin-bottom:4px;font-family:Georgia,serif}
audio{width:100%;margin-top:8px}
/* bottom nav */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;color:var(--muted);font-size:.68rem;padding:4px 8px;min-width:56px}
nav.tabs button .ic{font-size:1.25rem;line-height:1}
nav.tabs button.active{color:var(--accent);font-weight:700}
.backlink{background:transparent;color:var(--accent);font-weight:600;padding:8px 4px;margin:8px 0 0}
.addform{display:flex;flex-direction:column;gap:8px}
.center{text-align:center}
.spacer{height:8px}
</style>

<header class="app">
  <div class="brand">Bridge<span>.</span> <span class="muted" style="font-weight:400;font-size:.8rem">英語独学トレーナー</span></div>
  <div class="date" id="hdrDate"></div>
</header>

<main>

<!-- ============ HOME ============ -->
<section class="tab active" id="tab-home">
  <div class="card streak">
    <div>
      <div class="num" id="streakNum">0</div>
      <div class="muted small">連続コア達成</div>
    </div>
    <div style="flex:1">
      <div class="small" style="font-weight:700">今週の記録</div>
      <div class="week" id="weekStrip"></div>
    </div>
  </div>

  <h2><span class="eyebrow">TODAY</span> 今日の60分</h2>
  <div class="card">
    <div class="tasklist" id="taskList"></div>
    <p class="muted small" style="margin:12px 0 0">
      単語+英作文の30分が<strong>コア</strong>。忙しい日もここだけは死守。
      水・土・日は多聴の枠がスピーチに変わります。
    </p>
  </div>

  <h2><span class="eyebrow">PLAN</span> いまのフェーズ</h2>
  <div class="card small" id="phaseCard"></div>
</section>

<!-- ============ VOCAB ============ -->
<section class="tab" id="tab-vocab">
  <h2><span class="dot" style="background:var(--dot-vocab)"></span>単語(日 → 英)</h2>
  <div class="card" id="vocabHome"></div>
  <div class="card" id="vocabDrill" style="display:none"></div>
  <div class="card">
    <div class="small" style="font-weight:700;margin-bottom:8px">自分の用語を追加(仕事で出会った語をここへ)</div>
    <div class="addform">
      <input type="text" id="addJp" placeholder="日本語(例:現地事務所)">
      <input type="text" id="addEn" placeholder="英語(例:field office)">
      <button class="btn primary" id="addTermBtn" type="button">追加する</button>
      <div class="muted small" id="addMsg"></div>
    </div>
  </div>
</section>

<!-- ============ SAKUBUN ============ -->
<section class="tab" id="tab-sak">
  <h2><span class="dot" style="background:var(--dot-sak)"></span>口頭英作文</h2>
  <p class="muted small" style="margin:0 4px 10px">日本語を見て、<strong>声に出して</strong>英語を言ってから答えを見る。詰まらず言えたら「言えた」。</p>
  <div id="sakHome"></div>
  <div class="card" id="sakDrill" style="display:none"></div>
</section>

<!-- ============ SHADOWING ============ -->
<section class="tab" id="tab-shadow">
  <h2><span class="dot" style="background:var(--dot-shadow)"></span>シャドーイング</h2>
  <div id="shadowList"></div>
  <div id="shadowDetail" style="display:none"></div>
  <div class="card small">
    <div style="font-weight:700;margin-bottom:6px">音声の設定</div>
    <div class="controls">
      <label for="voiceSel">声</label>
      <select id="voiceSel"></select>
    </div>
    <p class="muted small" style="margin:6px 0 0">端末内蔵の音声合成を使用。iPhoneは「設定 &gt; アクセシビリティ &gt; 読み上げコンテンツ &gt; 声」で高品質な英語音声を追加できます。</p>
  </div>
</section>

<!-- ============ SPEECH ============ -->
<section class="tab" id="tab-speech">
  <h2><span class="dot" style="background:var(--dot-speech)"></span>1分間スピーチ</h2>
  <div id="speechHome"></div>
  <div id="speechDetail" style="display:none"></div>
</section>

</main>

<div class="timerbar" id="timerBar">
  <div class="inner">
    <span id="timerLabel" class="small"></span>
    <span class="time" id="timerTime">00:00</span>
    <button type="button" id="timerPause">一時停止</button>
    <button type="button" id="timerStop">終了</button>
  </div>
</div>

<nav class="tabs">
  <button data-tab="home" class="active" type="button"><span class="ic">🏠</span>今日</button>
  <button data-tab="vocab" type="button"><span class="ic">🗂</span>単語</button>
  <button data-tab="sak" type="button"><span class="ic">💬</span>英作文</button>
  <button data-tab="shadow" type="button"><span class="ic">🎧</span>シャドー</button>
  <button data-tab="speech" type="button"><span class="ic">🎤</span>スピーチ</button>
</nav>

/* ================= STATE ================= */
const KEY = "bridge_v1";
let S = {vocab:{}, custom:[], sak:{}, log:{}, newLog:{}, settings:{rate:0.95, voice:""}};
try{ const raw = localStorage.getItem(KEY); if(raw){ S = Object.assign(S, JSON.parse(raw)); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function todayStr(d){ d = d || new Date(); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function addDays(str, n){ const d = new Date(str+"T12:00:00"); d.setDate(d.getDate()+n); return todayStr(d); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================= TABS ================= */
const tabs = document.querySelectorAll("nav.tabs button");
tabs.forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
function showTab(name){
  speechSynthesis.cancel();
  tabs.forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll("section.tab").forEach(s => s.classList.toggle("active", s.id === "tab-"+name));
  if(name==="home") renderHome();
  if(name==="vocab") renderVocabHome();
  if(name==="sak") renderSakHome();
  if(name==="shadow") renderShadowList();
  if(name==="speech") renderSpeechHome();
  window.scrollTo(0,0);
}

/* ================= HOME ================= */
const DAY_TASKS = () => {
  const dow = new Date().getDay(); // 0=Sun
  const speechDay = (dow===0 || dow===3 || dow===6);
  return [
    {t:"単語(日→英)", s:"15分|新規+復習", min:15, tab:"vocab", dot:"var(--dot-vocab)"},
    {t:"口頭英作文", s:"15分|詰まらず言えるまで", min:15, tab:"sak", dot:"var(--dot-sak)"},
    {t:"シャドーイング", s:"20分|同じ素材を1週間", min:20, tab:"shadow", dot:"var(--dot-shadow)"},
    speechDay
      ? {t:"1分間スピーチ", s:"10分|録音→聞き直し→再録音", min:10, tab:"speech", dot:"var(--dot-speech)"}
      : {t:"多聴", s:"10分|elllo など理解できる素材", min:10, tab:"", dot:"var(--dot-listen)"}
  ];
};
function renderHome(){
  document.getElementById("hdrDate").textContent = new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"});
  const today = todayStr();
  const log = S.log[today] || [false,false,false,false];
  const tasksEl = document.getElementById("taskList");
  tasksEl.innerHTML = "";
  DAY_TASKS().forEach((task,i) => {
    const div = document.createElement("div");
    div.className = "task" + (log[i] ? " done" : "");
    div.innerHTML =
      '<button class="chk" type="button" aria-label="完了にする">'+(log[i]?"✓":"")+'</button>' +
      '<span class="dot" style="background:'+task.dot+'"></span>' +
      '<div class="info"><div class="t">'+esc(task.t)+'</div><div class="s">'+esc(task.s)+'</div></div>' +
      '<button class="go" type="button">▶ '+task.min+'分</button>';
    div.querySelector(".chk").addEventListener("click", () => {
      const l = S.log[today] || [false,false,false,false];
      l[i] = !l[i]; S.log[today] = l; save(); renderHome();
    });
    div.querySelector(".go").addEventListener("click", () => {
      startTimer(task.min*60, task.t);
      if(task.tab) showTab(task.tab);
    });
    tasksEl.appendChild(div);
  });
  // streak: consecutive days where core (task0 && task1) done
  let streak = 0; let d = today;
  const coreDone = day => { const l = S.log[day]; return !!(l && l[0] && l[1]); };
  if(!coreDone(d)) d = addDays(d,-1); // today not done yet doesn't break streak
  while(coreDone(d)){ streak++; d = addDays(d,-1); }
  document.getElementById("streakNum").textContent = streak;
  // week strip (last 7 days, ending today)
  const strip = document.getElementById("weekStrip"); strip.innerHTML = "";
  const names = ["日","月","火","水","木","金","土"];
  for(let i=6;i>=0;i--){
    const day = addDays(today,-i);
    const l = S.log[day];
    const full = !!(l && l.every(Boolean));
    const core = !!(l && l[0] && l[1]);
    const el = document.createElement("div");
    el.className = "d";
    el.innerHTML = '<div class="c '+(full?"full":(core?"core":""))+'">'+(full?"✓":(core?"◐":""))+'</div>'+names[new Date(day+"T12:00:00").getDay()];
    strip.appendChild(el);
  }
  // phase card
  const doneDays = Object.keys(S.log).filter(k => { const l=S.log[k]; return l && l[0] && l[1]; }).length;
  const week = Math.min(12, Math.floor(doneDays/6)+1);
  const phase = week<=4 ? ["Phase 1(1〜4週)|土台づくり","単語600を1周・口頭英作文Basic完了・身近なテーマでスピーチ。シャドーイングはA2素材でOK。"]
            : week<=8 ? ["Phase 2(5〜8週)|速度への対応","シャドーイングをB1素材へ。スピーチは仕事テーマに移行。マイ専門用語帳スタート。"]
            : ["Phase 3(9〜12週)|実戦投入","週2で実際に話す場(オンライン英会話/AI英会話)。スピーチのネタをレッスンで使い回す。"];
  document.getElementById("phaseCard").innerHTML =
    '<span class="pill">'+esc("推定 WEEK "+week)+'</span> <strong>'+esc(phase[0])+'</strong><br>'+esc(phase[1])+
    '<br><span class="muted">※ コア達成日数から推定(6日=1週換算)</span>';
}

/* ================= TIMER ================= */
let timer = {left:0, id:null, paused:false};
const timerBar = document.getElementById("timerBar");
function startTimer(sec, label){
  stopTimer();
  timer.left = sec; timer.paused = false;
  document.getElementById("timerLabel").textContent = label;
  timerBar.classList.add("on");
  tick();
  timer.id = setInterval(tick, 1000);
}
function tick(){
  if(timer.paused) return;
  const m = Math.floor(timer.left/60), s = timer.left%60;
  document.getElementById("timerTime").textContent = String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  if(timer.left <= 0){ stopTimer(); beep(); return; }
  timer.left--;
}
function stopTimer(){ if(timer.id){ clearInterval(timer.id); timer.id=null; } timerBar.classList.remove("on"); }
document.getElementById("timerStop").addEventListener("click", stopTimer);
document.getElementById("timerPause").addEventListener("click", e => {
  timer.paused = !timer.paused;
  e.target.textContent = timer.paused ? "再開" : "一時停止";
});
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.35,0.7].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; g.gain.setValueAtTime(0.2, ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+t+0.3);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.3);
    });
  }catch(e){}
}

let voices = [];
function loadVoices(){
  voices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("en"));
  const sel = document.getElementById("voiceSel");
  sel.innerHTML = "";
  voices.forEach((v,i) => {
    const o = document.createElement("option");
    o.value = v.name; o.textContent = v.name + " ("+v.lang+")";
    sel.appendChild(o);
  });
  if(S.settings.voice && voices.some(v=>v.name===S.settings.voice)) sel.value = S.settings.voice;
  else {
    const pref = voices.find(v=>/Samantha|Google US|Aaron|Karen|Daniel/i.test(v.name)) || voices.find(v=>v.lang==="en-US") || voices[0];
    if(pref) sel.value = pref.name;
  }
}
loadVoices();
if(typeof speechSynthesis !== "undefined") speechSynthesis.onvoiceschanged = loadVoices;
document.getElementById("voiceSel").addEventListener("change", e => { S.settings.voice = e.target.value; save(); });
function speak(text, rate, onend){
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = voices.find(x => x.name === document.getElementById("voiceSel").value);
  if(v) u.voice = v;
  u.lang = (v && v.lang) || "en-US";
  u.rate = rate || S.settings.rate || 0.95;
  if(onend) u.onend = onend;
  speechSynthesis.speak(u);
  return u;
}

/* ================= VOCAB ================= */
function allTerms(){ return VOCAB.concat(S.custom); }
function vocabState(id){ return S.vocab[id]; }
const INTERVALS = [1,2,4,7,14,30];
function buildVocabQueue(){
  const today = todayStr();
  const due = [], fresh = [];
  allTerms().forEach(t => {
    const st = S.vocab[t.id];
    if(st){ if(st.due <= today) due.push(t); }
    else fresh.push(t);
  });
  const newToday = (S.newLog[today]||0);
  const newCap = Math.max(0, 10 - newToday);
  return due.concat(fresh.slice(0, newCap));
}
function renderVocabHome(){
  const today = todayStr();
  const learned = Object.keys(S.vocab).length;
  const mastered = Object.values(S.vocab).filter(s=>s.box>=4).length;
  const queue = buildVocabQueue();
  document.getElementById("vocabDrill").style.display = "none";
  const el = document.getElementById("vocabHome");
  el.style.display = "";
  el.innerHTML =
    '<div style="display:flex;gap:18px;margin-bottom:12px">'+
    '<div><div style="font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums">'+queue.length+'</div><div class="muted small">今日のカード</div></div>'+
    '<div><div style="font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums">'+learned+'<span class="muted" style="font-size:.9rem;font-weight:400">/'+allTerms().length+'</span></div><div class="muted small">学習済み</div></div>'+
    '<div><div style="font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums">'+mastered+'</div><div class="muted small">定着(Box4+)</div></div>'+
    '</div>'+
    (queue.length
      ? '<button class="btn primary" id="startVocab" type="button" style="width:100%">今日の単語を始める</button>'
      : '<p class="muted center" style="margin:6px 0">今日の分は完了!また明日 🎉</p>');
  const b = document.getElementById("startVocab");
  if(b) b.addEventListener("click", () => startVocabDrill(queue));
}
function startVocabDrill(queue){
  const drill = document.getElementById("vocabDrill");
  document.getElementById("vocabHome").style.display = "none";
  drill.style.display = "";
  let i = 0; const total = queue.length; let doneCount = 0;
  const today = todayStr();
  function show(){
    if(i >= queue.length){ drill.style.display="none"; renderVocabHome(); return; }
    const t = queue[i];
    const isNew = !S.vocab[t.id];
    drill.innerHTML =
      '<div class="progress"><i style="width:'+Math.round(doneCount/Math.max(total,1)*100)+'%"></i></div>'+
      '<div class="drillcard">'+
      (isNew?'<span class="pill" style="align-self:center">NEW</span>':'')+
      '<div class="q">'+esc(t.jp)+'</div>'+
      '<div id="ansArea"><button class="btn primary" id="revealBtn" type="button">答えを見る</button></div>'+
      '</div>';
    document.getElementById("revealBtn").addEventListener("click", () => {
      document.getElementById("ansArea").innerHTML =
        '<div class="a">'+esc(t.en)+' <button class="btn ghost" id="sayBtn" type="button" aria-label="発音を聞く">🔊</button></div>'+
        '<div class="btnrow" style="margin-top:10px">'+
        '<button class="btn warn" id="ngBtn" type="button">言えなかった</button>'+
        '<button class="btn good" id="okBtn" type="button">言えた</button></div>';
      document.getElementById("sayBtn").addEventListener("click", () => speak(t.en));
      speak(t.en);
      document.getElementById("ngBtn").addEventListener("click", () => grade(t, false));
      document.getElementById("okBtn").addEventListener("click", () => grade(t, true));
    });
  }
  function grade(t, ok){
    const wasNew = !S.vocab[t.id];
    if(wasNew){ S.newLog[today] = (S.newLog[today]||0)+1; }
    let st = S.vocab[t.id] || {box:0, due:today};
    if(ok){
      st.box = Math.min(st.box+1, 5);
      st.due = addDays(today, INTERVALS[st.box-1] || 1);
      doneCount++;
    } else {
      st.box = 0; st.due = today;
      queue.push(t); // 同じセッション内で再挑戦
    }
    S.vocab[t.id] = st; save();
    i++; show();
  }
  show();
}

});

function startSakDrill(set){
  document.getElementById("sakHome").style.display = "none";
  const drill = document.getElementById("sakDrill");
  drill.style.display = "";
  // 出題順: 言えなかった → 未挑戦 → 言えた(復習)。1セッション15問。
  const idxs = set.items.map((_,i)=>i);
  const ngs = idxs.filter(i=>S.sak[sakId(set.key,i)]==="ng");
  const news = idxs.filter(i=>!S.sak[sakId(set.key,i)]);
  const oks = idxs.filter(i=>S.sak[sakId(set.key,i)]==="ok");
  const queue = ngs.concat(news).concat(oks).slice(0,15);
  let pos = 0;
  function show(){
    if(pos >= queue.length){ drill.style.display="none"; renderSakHome(); return; }
    const i = queue[pos];
    const item = set.items[i];
    drill.innerHTML =
      '<button class="backlink" id="sakBack" type="button">‹ セット一覧へ</button>'+
      '<div class="progress"><i style="width:'+Math.round(pos/queue.length*100)+'%"></i></div>'+
      '<div class="drillcard">'+
      '<div class="muted small">'+(pos+1)+' / '+queue.length+'</div>'+
      '<div class="q">'+esc(item[0])+'</div>'+
      '<div id="sakAns"><button class="btn primary" id="sakReveal" type="button">答えを見る</button></div>'+
      '</div>';
    document.getElementById("sakBack").addEventListener("click", () => { speechSynthesis.cancel(); renderSakHome(); });
    document.getElementById("sakReveal").addEventListener("click", () => {
      document.getElementById("sakAns").innerHTML =
        '<div class="a">'+esc(item[1])+' <button class="btn ghost" id="sakSay" type="button" aria-label="発音を聞く">🔊</button></div>'+
        '<div class="muted small" style="margin-top:4px">3回、声に出して繰り返す</div>'+
        '<div class="btnrow" style="margin-top:10px">'+
        '<button class="btn warn" id="sakNg" type="button">言えなかった</button>'+
        '<button class="btn good" id="sakOk" type="button">言えた</button></div>';
      speak(item[1]);
      document.getElementById("sakSay").addEventListener("click", () => speak(item[1]));
      document.getElementById("sakNg").addEventListener("click", () => { S.sak[sakId(set.key,i)]="ng"; save(); pos++; show(); });
      document.getElementById("sakOk").addEventListener("click", () => { S.sak[sakId(set.key,i)]="ok"; save(); pos++; show(); });
    });
  }
  show();
}

let shadowPlaying = false;
function renderShadowDetail(sc){
  document.getElementById("shadowList").style.display = "none";
  const d = document.getElementById("shadowDetail");
  d.style.display = "";
  let showJp = false;
  const rate = S.settings.rate || 0.95;
  d.innerHTML =
    '<button class="backlink" id="shBack" type="button">‹ 教材一覧へ</button>'+
    '<div class="card">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'+
    '<div><span class="pill">'+sc.level+'</span> <strong>'+esc(sc.title)+'</strong><div class="muted small">'+esc(sc.jpTitle)+'</div></div>'+
    '</div>'+
    '<div class="controls">'+
    '<button class="btn primary" id="shPlay" type="button">▶ 全文再生</button>'+
    '<button class="btn" id="shJp" type="button">訳を表示</button>'+
    '</div>'+
    '<div class="controls">'+
    '<label for="shRate">速度 <span id="shRateVal">'+rate.toFixed(2)+'</span>x</label>'+
    '<input type="range" id="shRate" min="0.7" max="1.2" step="0.05" value="'+rate+'">'+
    '</div>'+
    '<div class="script" id="shText"></div>'+
    '<div class="vocabnote" id="shVocab"></div>'+
    '</div>';
  document.getElementById("shBack").addEventListener("click", () => { speechSynthesis.cancel(); shadowPlaying=false; renderShadowList(); });
  const textEl = document.getElementById("shText");
  function renderText(){
    textEl.innerHTML = "";
    sc.sents.forEach((pair, i) => {
      const span = document.createElement("span");
      span.className = "sent"; span.id = "sent-"+i; span.tabIndex = 0;
      span.textContent = pair[0] + " ";
      span.addEventListener("click", () => playOne(i));
      span.addEventListener("keydown", e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); playOne(i);} });
      textEl.appendChild(span);
      if(showJp){
        const jp = document.createElement("span");
        jp.className = "jp-line"; jp.textContent = pair[1];
        textEl.appendChild(jp);
      }
    });
  }
  renderText();
  const vEl = document.getElementById("shVocab");
  vEl.innerHTML = '<div class="muted small" style="margin-bottom:6px;font-weight:700">キー表現</div>' +
    sc.vocab.map(v => '<div><dt>'+esc(v[0])+'</dt><dd>'+esc(v[1])+'</dd></div>').join("");
  function curRate(){ return parseFloat(document.getElementById("shRate").value); }
  document.getElementById("shRate").addEventListener("input", e => {
    document.getElementById("shRateVal").textContent = parseFloat(e.target.value).toFixed(2);
    S.settings.rate = parseFloat(e.target.value); save();
  });
  function highlight(i){
    sc.sents.forEach((_,j) => {
      const el = document.getElementById("sent-"+j);
      if(el) el.classList.toggle("playing", j===i);
    });
  }
  function playOne(i){
    shadowPlaying = false;
    highlight(i);
    speak(sc.sents[i][0], curRate(), () => highlight(-1));
  }
  function playAll(i){
    if(i >= sc.sents.length){ shadowPlaying=false; highlight(-1); document.getElementById("shPlay").textContent="▶ 全文再生"; return; }
    highlight(i);
    speak(sc.sents[i][0], curRate(), () => { if(shadowPlaying) playAll(i+1); });
  }
  document.getElementById("shPlay").addEventListener("click", () => {
    if(shadowPlaying){ shadowPlaying=false; speechSynthesis.cancel(); highlight(-1); document.getElementById("shPlay").textContent="▶ 全文再生"; return; }
    shadowPlaying = true;
    document.getElementById("shPlay").textContent = "■ 停止";
    playAll(0);
  });
  document.getElementById("shJp").addEventListener("click", e => {
    showJp = !showJp; e.target.textContent = showJp ? "訳を隠す" : "訳を表示";
    renderText();
  });
}

let rec = {media:null, recorder:null, chunks:[], timerId:null, sec:60};
function stopRecordingCleanup(){
  if(rec.timerId){ clearInterval(rec.timerId); rec.timerId = null; }
  if(rec.recorder && rec.recorder.state !== "inactive"){ try{ rec.recorder.stop(); }catch(e){} }
  if(rec.media){ rec.media.getTracks().forEach(t=>t.stop()); rec.media = null; }
}
function renderSpeechDetail(item){
  document.getElementById("speechHome").style.display = "none";
  const d = document.getElementById("speechDetail");
  d.style.display = "";
  d.innerHTML =
    '<button class="backlink" id="spBack" type="button">‹ テーマ一覧へ</button>'+
    '<div class="card">'+
    '<div class="center"><strong style="font-size:1.15rem">'+esc(item[0])+'</strong><div class="muted">'+esc(item[1])+'</div></div>'+
    '<div class="small" style="margin-top:10px;font-weight:700">ヒント(この問いに答える形で)</div>'+
    '<ul class="hints">'+item[2].map(h=>'<li>'+esc(h)+'</li>').join("")+'</ul>'+
    '<div class="bigtimer" id="spTimer">1:00</div>'+
    '<div class="btnrow">'+
    '<button class="btn primary" id="spStart" type="button">● 録音して開始</button>'+
    '<button class="btn" id="spTimerOnly" type="button">タイマーのみ</button>'+
    '</div>'+
    '<div id="spResult"></div>'+
    '<p class="muted small" style="margin:12px 0 0">詰まってもOK。まず1分間、止まらずに話し続けることが目標。終わったら聞き直して、言えなかった表現をメモ→単語タブに追加。</p>'+
    '</div>';
  document.getElementById("spBack").addEventListener("click", () => { stopRecordingCleanup(); renderSpeechHome(); });
  const timerEl = document.getElementById("spTimer");
  function runCountdown(onDone){
    let left = 60;
    timerEl.textContent = "1:00";
    rec.timerId = setInterval(() => {
      left--;
      timerEl.textContent = Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
      if(left<=0){ clearInterval(rec.timerId); rec.timerId=null; beep(); if(onDone) onDone(); }
    }, 1000);
  }
  document.getElementById("spTimerOnly").addEventListener("click", () => {
    if(rec.timerId){ clearInterval(rec.timerId); rec.timerId=null; timerEl.textContent="1:00"; return; }
    runCountdown();
  });
  document.getElementById("spStart").addEventListener("click", async (e) => {
    const btn = e.target;
    if(rec.recorder && rec.recorder.state === "recording"){
      rec.recorder.stop();
      if(rec.timerId){ clearInterval(rec.timerId); rec.timerId=null; }
      return;
    }
    if(!navigator.mediaDevices || !window.MediaRecorder){
      document.getElementById("spResult").innerHTML = '<p class="muted small">この環境では録音を利用できません。タイマーのみで練習し、スマホの標準ボイスメモで録音してください。</p>';
      runCountdown();
      return;
    }
    try{
      rec.media = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(err){
      document.getElementById("spResult").innerHTML = '<p class="muted small">マイクを利用できませんでした(許可が必要です)。タイマーのみで練習できます。</p>';
      runCountdown();
      return;
    }
    rec.chunks = [];
    rec.recorder = new MediaRecorder(rec.media);
    rec.recorder.ondataavailable = ev => { if(ev.data.size) rec.chunks.push(ev.data); };
    rec.recorder.onstop = () => {
      const blob = new Blob(rec.chunks, {type: rec.recorder.mimeType || "audio/webm"});
      const url = URL.createObjectURL(blob);
      const ext = (blob.type.includes("mp4")||blob.type.includes("aac")) ? "m4a" : "webm";
      const fname = "speech_"+todayStr()+"."+ext;
      document.getElementById("spResult").innerHTML =
        '<audio controls src="'+url+'"></audio>'+
        '<div class="btnrow" style="margin-top:8px"><a class="btn" download="'+fname+'" href="'+url+'" style="text-decoration:none;color:inherit">⬇ 録音を保存</a></div>'+
        '<p class="muted small" style="margin:8px 0 0">週1回は保存して、先週の自分と聞き比べを。</p>';
      btn.textContent = "● 録音して開始";
      if(rec.media){ rec.media.getTracks().forEach(t=>t.stop()); rec.media=null; }
    };
    rec.recorder.start();
    btn.textContent = "■ 録音を止める";
    document.getElementById("spResult").innerHTML = "";
    runCountdown(() => { if(rec.recorder && rec.recorder.state==="recording") rec.recorder.stop(); });
  });
}
